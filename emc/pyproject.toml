[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emc-sim"
version = "0.1.0"
description = "Reusable utilities for traceable, bounded EMC pre-design simulations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
network = ["numpy>=1.26", "scikit-rf>=1.0"]
gerber = ["gerbonara>=1.6", "shapely>=2.0", "matplotlib>=3.8"]
spice = ["PyYAML>=6", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]
all = ["pytest>=8", "numpy>=1.26", "scipy>=1.11", "scikit-rf>=1.0", "gerbonara>=1.6", "shapely>=2.0", "matplotlib>=3.8", "PyYAML>=6"]

[tool.setuptools]
packages = ["emc_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
